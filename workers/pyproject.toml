[project]
name = "ft-lineone-workers"
version = "2.0.0"
description = "FT-LineOne API - Cloudflare Workers"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.125.0",
    "pydantic==1.10.18",
    "httpx",
    "python-multipart",
    "cryptography>=42.0.0",
    "argon2-cffi>=23.1.0",
]

[dependency-groups]
dev = [
    "workers-py",
    "workers-runtime-sdk",
    "vitest",
    "@cloudflare/vitest-pool-workers",
    "pytest",
    "pytest-asyncio",
    "httpx",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]
